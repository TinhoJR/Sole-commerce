{% load static %}

<!DOCTYPE html>

<html lang="en">


<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'CSS/dashboard_mobile.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">

</head>


<body>

    <nav class="navbar">
        
        <button id="menu-toggle"><i class="fas fa-bars"></i></button>
        <div class="nav-controls">
        <p>{{request.user.username}}</p>
        <button id="darkmode-toggle"><i class="fas fa-moon"></i></button>
        <button id="profile-btn">Profile</button>
        </div>
    </nav>

    <div class="sidebar">
    <ul>
      <li><a href="{% url 'dashboard' %}" class="accordion-btn"><i class="fas fa-home"></i><span class="text">Dashboard</span></a></li>
      <li><a href="{% url 'order_list' %}" class="accordion-btn"><i class="fa-solid fa-clipboard-list"></i><span class="text">My Orders</span></a></li>
      <li><a href="{% url 'profile' %}" class="accordion-btn" data-section="invest"><i class="fa-regular fa-heart"></i><span class="text">Favorite</span></a></li>
      <li><a class="accordion-btn" data-section="withdraw"><i class="fa-solid fa-location-crosshairs"></i><span class="text">My Addresses</span></a></li>
      <li><a class="accordion-btn" data-section="invest"><i class="fa-solid fa-lock"></i><span class="text">Change Password</span></a></li>
      <li><a class="accordion-btn" data-section="withdraw"><i class="fa-solid fa-right-from-bracket"></i><span class="text">Log Out</span></a></li>
    </ul>
    </div>

{% block content %}

{% endblock %}



<script src="{% static 'JS/dashboard.js' %}"></script>    


</body>

</html>
